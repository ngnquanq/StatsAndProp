name: Watch CS329Z course site

on:
  schedule:
    # GitHub cron is weekly; the due check below keeps an exact 14-day cadence.
    - cron: '17 2 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check fortnightly cadence
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, datetime, timezone
          anchor = date(2026, 11, 24)
          weeks = (datetime.now(timezone.utc).date() - anchor).days // 7
          print(f'run={str(weeks >= 0 and weeks % 2 == 0).lower()}')
          PY
          fi
      - name: Checkout
        if: steps.due.outputs.run == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Node.js
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '99. For fun/agent-engineering/package-lock.json'
      - name: Install Playwright
        if: steps.due.outputs.run == 'true'
        working-directory: '99. For fun/agent-engineering'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Crawl course site
        if: steps.due.outputs.run == 'true'
        working-directory: '99. For fun/agent-engineering'
        run: npm run crawl
      - name: Commit crawl results
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '99. For fun/agent-engineering/course.json' '99. For fun/agent-engineering/COURSE.md' '99. For fun/agent-engineering/CHANGES.md'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh CS329Z course snapshot'
            git push
          fi
