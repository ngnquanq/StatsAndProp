[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
forks = 25
timeout = 30
stdout_callback = yaml

[ssh_connection]
pipelining = False
ssh_args = -C -o ControlMaster=no -o ControlPersist=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=2
